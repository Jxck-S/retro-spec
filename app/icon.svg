<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- dark background -->
  <rect width="32" height="32" rx="7" fill="#09090b"/>
  <!-- clock face -->
  <circle cx="16" cy="16" r="9.5" stroke="#818cf8" stroke-width="1.5" fill="none"/>
  <!-- hour hand pointing up (12) -->
  <line x1="16" y1="16" x2="16" y2="9.5" stroke="#818cf8" stroke-width="1.75" stroke-linecap="round"/>
  <!-- minute hand pointing right (~3) -->
  <line x1="16" y1="16" x2="21" y2="18" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- center dot -->
  <circle cx="16" cy="16" r="1.75" fill="#818cf8"/>
  <!-- 12 o'clock tick -->
  <line x1="16" y1="7" x2="16" y2="8.5" stroke="#52525b" stroke-width="1.25" stroke-linecap="round"/>
  <!-- 3 o'clock tick -->
  <line x1="25" y1="16" x2="23.5" y2="16" stroke="#52525b" stroke-width="1.25" stroke-linecap="round"/>
  <!-- 6 o'clock tick -->
  <line x1="16" y1="25" x2="16" y2="23.5" stroke="#52525b" stroke-width="1.25" stroke-linecap="round"/>
  <!-- 9 o'clock tick -->
  <line x1="7" y1="16" x2="8.5" y2="16" stroke="#52525b" stroke-width="1.25" stroke-linecap="round"/>
</svg>
